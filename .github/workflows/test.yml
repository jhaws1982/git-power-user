name: test the lessons
# Every command in every post, run and compared with what the post shows.
on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"   # Mondays: catches a new git release changing its output
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lessons:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        git: [ubuntu-24.04, latest]
    steps:
      - uses: actions/checkout@v5
      - name: Pick the git version
        id: ref
        run: |
          if [ "${{ matrix.git }}" = latest ]; then
            ref=$(git ls-remote --tags --refs https://github.com/git/git.git 'v*' |
                  awk -F/ '{print $3}' | grep -Ev 'rc|-' | sort -V | tail -1)
          else
            ref=""
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Build the test image
        run: |
          docker build --progress=plain -t lessons --build-arg GIT_REF=${{ steps.ref.outputs.ref }} docker/ > build.log 2>&1 || {
            { grep -iE 'error|not found' build.log | tail -n 6; tail -n 2 build.log; } | sed 's/^/::error::/'; exit 1; }
          tail -n 3 build.log
      - name: Run every lesson
        # The posts show Ubuntu 24.04's git, so that run must match exactly. A newer
        # git is compared with its recorded differences (tests/known-differences/).
        run: |
          if [ "${{ matrix.git }}" = latest ]; then
            docker run --rm -v "$PWD:/course" -w /course lessons tests/compare-known.sh
          else
            docker run --rm -v "$PWD:/course" -w /course lessons tests/run-all.sh
          fi
      - name: Check every exercise can be passed
        run: docker run --rm -v "$PWD:/course" -w /course lessons tests/run-exercises.sh
      - name: Open an issue when the weekly run fails
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Lesson transcripts no longer match (git ${{ matrix.git }} ${{ steps.ref.outputs.ref }})" \
            --body "The weekly run failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  windows:
    # Readers on Windows run the exercises in Git Bash, and lessons 4, 5, and
    # bonus 2 give Windows-specific steps. Both are checked on a real Windows runner.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check every exercise can be passed (Git Bash)
        shell: bash
        run: |
          git --version
          tests/run-exercises.sh 2>&1 | tee exercises.log
          status=${PIPESTATUS[0]}
          tests/annotate.sh exercises.log "Windows exercises"
          if [ "$status" != 0 ] && ! grep -q '^FAIL' exercises.log; then
            { printf '::error title=Windows exercises (log tail)::'; tail -n 15 exercises.log | sed 's/%/%25/g' | tr -d '\r' | awk -v ORS='%0A' 1; echo; }
          fi
          { printf '::notice title=Windows exercises passed::'; grep '^ok' exercises.log | sed 's/%/%25/g' | tr -d '\r' | awk -v ORS='%0A' 1; echo; }
          exit "$status"
      - name: Check the Windows steps in lessons 4, 5, and B2 (PowerShell)
        if: always()
        shell: pwsh
        run: |
          $t = $null; $e = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/tests/windows/check-windows.ps1", [ref]$t, [ref]$e) | Out-Null
          if ($e.Count) { $e | ForEach-Object { "::error title=check-windows.ps1 parse error::$($_.ToString() -replace "`r?`n", '%0A')" }; exit 1 }
          try { tests/windows/check-windows.ps1 } catch { "::error title=check-windows.ps1 stopped::$($_ -replace "`r?`n", '%0A')"; exit 1 }
      - name: Open an issue when the weekly run fails
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Windows checks failed" `
            --body "The weekly run failed on windows-latest: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  published-posts:
    # Once a lesson is published, its live post must still match transcript.md.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: python3 tools/check-live.py
